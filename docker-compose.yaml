services:

  mysql:
    image: mysql:8.0
    container_name: student-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: studentdb
    ports:
      - "3308:3306"

  student-lms:
    build: .
    container_name: student-lms-container
    ports:
      - "8081:8080"
    depends_on:
      - mysql